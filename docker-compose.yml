services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: vayora, POSTGRES_PASSWORD: vayora, POSTGRES_DB: vayora }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://vayora:vayora@db:5432/vayora
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads]
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://vayora:vayora@db:5432/vayora
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app worker -B -l info
    depends_on: [db, redis]
volumes: { pgdata: {}, uploads: {} }
